name: Release

# Push a tag like v0.1.0 to build static single binaries and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            name: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cargo-zigbuild --locked
          pip3 install ziglang
      - name: Test
        run: cargo test --locked
      - name: Build static binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=batchmail-${{ matrix.name }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/batchmail .env.example README.md LICENSE deploy/batchmail.service "$dir"/
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: batchmail-${{ matrix.name }}
          path: batchmail-${{ matrix.name }}.tar.gz*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: batchmail-*.tar.gz*
          generate_release_notes: true
